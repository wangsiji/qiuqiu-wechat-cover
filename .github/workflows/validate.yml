name: Validate skill

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skill package
        run: python3 tools/validate_skill.py .
      - name: Validate sample brief
        run: python3 tools/validate_brief.py examples/sample-brief.json
      - name: Compile sample prompt
        run: |
          python3 tools/compile_prompt.py examples/sample-brief.json -o /tmp/sample-prompt.txt
          test -s /tmp/sample-prompt.txt
          grep -q "ALLOWED TEXT ONLY" /tmp/sample-prompt.txt
          grep -q "戴了6年还在戴" /tmp/sample-prompt.txt
          grep -q "2.35:1" /tmp/sample-prompt.txt
      - name: Regression test failure patches
        run: python3 tools/test_failure_patches.py
      - name: Regression test first-run setup
        run: python3 tools/test_init.py
